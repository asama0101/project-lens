<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" font-family="'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">画面の 5 つのタブ</title>
  <desc id="d">画面上部の 5 つのタブ。ガントチャートはバーで期間を見る。リストは表で編集する。スケジュールは作業枠と会議を置く。稼働はプロジェクト別の時間を集計する。設定は営業日・休み・会議名の規則を扱う。</desc>
  <rect width="800" height="230" fill="#ffffff"/>
  <rect x="6" y="10" width="788" height="44" rx="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="14" y="16" width="148" height="32" rx="16" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="88" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">ガントチャート</text>
  <text x="248" y="38" text-anchor="middle" font-size="15" fill="#1e293b">リスト</text>
  <text x="408" y="38" text-anchor="middle" font-size="15" fill="#1e293b">スケジュール</text>
  <text x="568" y="38" text-anchor="middle" font-size="15" fill="#1e293b">稼働</text>
  <text x="728" y="38" text-anchor="middle" font-size="15" fill="#1e293b">設定</text>

  <rect x="6" y="70" width="148" height="150" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <rect x="22" y="86" width="60" height="10" rx="3" fill="#0369a1"/>
  <rect x="44" y="104" width="70" height="10" rx="3" fill="#0369a1"/>
  <text x="80" y="148" text-anchor="middle" font-size="14" fill="#0c4a6e">タスクの期間を</text>
  <text x="80" y="168" text-anchor="middle" font-size="14" fill="#0c4a6e">バーで見る</text>
  <text x="80" y="196" text-anchor="middle" font-size="14" fill="#0c4a6e">ドラッグで日程変更</text>

  <rect x="166" y="70" width="148" height="150" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <line x1="184" y1="92" x2="296" y2="92" stroke="#0369a1" stroke-width="2"/>
  <line x1="184" y1="108" x2="296" y2="108" stroke="#0369a1" stroke-width="2"/>
  <line x1="184" y1="124" x2="296" y2="124" stroke="#0369a1" stroke-width="2"/>
  <text x="240" y="158" text-anchor="middle" font-size="14" fill="#0c4a6e">タスクを表で</text>
  <text x="240" y="178" text-anchor="middle" font-size="14" fill="#0c4a6e">見て編集する</text>

  <rect x="326" y="70" width="148" height="150" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <rect x="352" y="84" width="22" height="40" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="380" y="84" width="22" height="40" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="408" y="84" width="22" height="40" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="355" y="92" width="16" height="14" fill="#c2410c"/>
  <rect x="411" y="100" width="16" height="18" fill="#c2410c" opacity="0.5"/>
  <text x="400" y="152" text-anchor="middle" font-size="14" fill="#7c2d12">週／日の枠に</text>
  <text x="400" y="172" text-anchor="middle" font-size="14" fill="#7c2d12">作業枠と会議を置く</text>

  <rect x="486" y="70" width="148" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <rect x="528" y="104" width="16" height="22" fill="#15803d"/>
  <rect x="550" y="88" width="16" height="38" fill="#15803d"/>
  <rect x="572" y="98" width="16" height="28" fill="#15803d"/>
  <text x="560" y="152" text-anchor="middle" font-size="14" fill="#14532d">日／週／月ごとに</text>
  <text x="560" y="172" text-anchor="middle" font-size="14" fill="#14532d">プロジェクト別の</text>
  <text x="560" y="192" text-anchor="middle" font-size="14" fill="#14532d">時間を集計する</text>

  <rect x="646" y="70" width="148" height="150" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <line x1="668" y1="92" x2="772" y2="92" stroke="#475569" stroke-width="2"/><circle cx="700" cy="92" r="6" fill="#475569"/>
  <line x1="668" y1="112" x2="772" y2="112" stroke="#475569" stroke-width="2"/><circle cx="745" cy="112" r="6" fill="#475569"/>
  <text x="720" y="152" text-anchor="middle" font-size="14" fill="#1e293b">営業日の数え方</text>
  <text x="720" y="172" text-anchor="middle" font-size="14" fill="#1e293b">休み・営業日の指定</text>
  <text x="720" y="192" text-anchor="middle" font-size="14" fill="#1e293b">会議名の規則</text>
</svg>
