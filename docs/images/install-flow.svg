<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">導入の流れ</title>
  <desc id="d">4 つの手順。Claude Code で、マーケットプレイスを登録し、プラグインを入れ、プロジェクトのフォルダで init を実行する。そのあと、Edge か Chrome で project-lens.html を開き、data.json を選ぶ。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="220" fill="#ffffff"/>

  <rect x="6" y="12" width="574" height="28" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="293" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">Claude Code で実行する</text>
  <rect x="594" y="12" width="200" height="28" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="694" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#0c4a6e">Edge か Chrome</text>

  <rect x="6" y="56" width="176" height="150" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="94" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">1. 配布元を登録</text>
  <text x="94" y="120" text-anchor="middle" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#1e293b">/plugin marketplace</text>
  <text x="94" y="138" text-anchor="middle" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#1e293b">add asama0101/</text>
  <text x="94" y="156" text-anchor="middle" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#1e293b">project-lens</text>

  <rect x="210" y="56" width="176" height="150" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="298" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">2. プラグインを入れる</text>
  <text x="298" y="120" text-anchor="middle" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#1e293b">/plugin install</text>
  <text x="298" y="138" text-anchor="middle" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#1e293b">project-lens@</text>
  <text x="298" y="156" text-anchor="middle" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#1e293b">project-lens</text>

  <rect x="414" y="56" width="158" height="150" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="493" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">3. 準備する</text>
  <text x="493" y="120" text-anchor="middle" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#1e293b">/project-lens:init</text>
  <text x="493" y="150" text-anchor="middle" font-size="14" fill="#1e293b">プロジェクトの</text>
  <text x="493" y="170" text-anchor="middle" font-size="14" fill="#1e293b">フォルダで実行</text>

  <rect x="594" y="56" width="200" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="694" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">4. 画面を開く</text>
  <text x="694" y="120" text-anchor="middle" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#14532d">project-lens.html</text>
  <text x="694" y="150" text-anchor="middle" font-size="14" fill="#14532d">「ファイルを開く」で</text>
  <text x="694" y="170" text-anchor="middle" font-size="14" fill="#14532d">data.json を選ぶ</text>

  <line x1="184" y1="131" x2="206" y2="131" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="388" y1="131" x2="410" y2="131" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="574" y1="131" x2="590" y2="131" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
</svg>
