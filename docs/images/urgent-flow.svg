<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">突発タスクを登録する流れ</title>
  <desc id="d">画面上部の「＋ 突発タスク」を押す。スケジュール画面に入力欄が開き、日付と開始が入る。件名・プロジェクト・長さ・日付・開始を入れて Enter か追加を押すと、タスクと作業枠が同時に作られる。Esc・欄の外のクリック・キャンセルでは、何も作らずに閉じる。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>

  <rect x="6" y="14" width="196" height="150" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="104" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">1. ボタンを押す</text>
  <text x="104" y="76" text-anchor="middle" font-size="14" fill="#1e293b">画面上部の</text>
  <text x="104" y="96" text-anchor="middle" font-size="14" fill="#1e293b">「＋ 突発タスク」</text>
  <text x="104" y="116" text-anchor="middle" font-size="14" fill="#1e293b">（どの画面でも）</text>

  <rect x="228" y="14" width="164" height="150" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="310" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">2. 入力欄が開く</text>
  <text x="310" y="76" text-anchor="middle" font-size="14" fill="#1e293b">スケジュールに開き、</text>
  <text x="310" y="96" text-anchor="middle" font-size="14" fill="#1e293b">日付と開始が入る</text>
  <text x="310" y="116" text-anchor="middle" font-size="14" fill="#1e293b">（変えられる）</text>

  <rect x="418" y="14" width="376" height="150" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="606" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">3. 入力欄に入れる</text>
  <rect x="436" y="54" width="104" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="488" y="73" text-anchor="middle" font-size="14" fill="#1e293b">件名</text>
  <rect x="548" y="54" width="124" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="610" y="73" text-anchor="middle" font-size="14" fill="#1e293b">プロジェクト</text>
  <rect x="680" y="54" width="100" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="730" y="73" text-anchor="middle" font-size="14" fill="#1e293b">長さ</text>
  <rect x="436" y="88" width="168" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="107" text-anchor="middle" font-size="14" fill="#1e293b">日付（📅 でも選べる）</text>
  <rect x="612" y="88" width="100" height="28" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="662" y="107" text-anchor="middle" font-size="14" fill="#1e293b">開始</text>
  <text x="606" y="136" text-anchor="middle" font-size="14" fill="#1e293b">長さは 15・30・45・60 分（初期値 30）</text>
  <text x="606" y="155" text-anchor="middle" font-size="14" fill="#1e293b">入れたら Enter か「追加」</text>

  <line x1="204" y1="89" x2="224" y2="89" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="394" y1="89" x2="414" y2="89" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <rect x="418" y="220" width="376" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="606" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">タスクと作業枠を、同時に作る</text>
  <text x="606" y="274" text-anchor="middle" font-size="14" fill="#14532d">タスク: 期限・開始日は入力欄の日付、In Progress</text>
  <text x="606" y="298" text-anchor="middle" font-size="14" fill="#14532d">作業枠（予定）: 入力欄の開始から、選んだ長さ</text>
  <line x1="606" y1="168" x2="606" y2="216" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="616" y="198" font-size="14" fill="#1e293b">追加</text>

  <rect x="6" y="220" width="300" height="100" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="156" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">何も作らずに閉じる</text>
  <text x="156" y="274" text-anchor="middle" font-size="14" fill="#1e293b">Esc・欄の外のクリック・</text>
  <text x="156" y="296" text-anchor="middle" font-size="14" fill="#1e293b">「キャンセル」</text>
  <path d="M470,168 C470,205 330,190 250,216" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="350" y="186" font-size="14" fill="#1e293b">やめる</text>
</svg>
