<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">project-lens の全体図</title>
  <desc id="d">ブラウザの project-lens.html と Claude Code が、同じ .project-lens/data.json を読み書きする。project-lens.html は data.json を表示して、直接保存する。Claude Code は、Excel の WBS と予定表の会議を取り込み、依頼の帯から届いた依頼を処理する。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>

  <rect x="250" y="20" width="300" height="100" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="400" y="54" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">project-lens.html（ブラウザ）</text>
  <text x="400" y="78" text-anchor="middle" font-size="15" fill="#0c4a6e">ガントチャート・リスト・スケジュール</text>
  <text x="400" y="100" text-anchor="middle" font-size="15" fill="#0c4a6e">稼働・設定・依頼の帯</text>

  <rect x="250" y="210" width="300" height="80" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="400" y="244" text-anchor="middle" font-size="18" font-weight="bold" fill="#713f12">.project-lens/data.json</text>
  <text x="400" y="268" text-anchor="middle" font-size="15" fill="#713f12">プロジェクト・タスク・設定・依頼</text>

  <rect x="250" y="380" width="300" height="100" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="400" y="414" text-anchor="middle" font-size="18" font-weight="bold" fill="#7c2d12">Claude Code</text>
  <text x="400" y="440" text-anchor="middle" font-size="15" fill="#7c2d12">/project-lens:intake（取り込み）</text>
  <text x="400" y="462" text-anchor="middle" font-size="15" fill="#7c2d12">/project-lens:watch（依頼の処理）</text>

  <rect x="20" y="385" width="170" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="105" y="411" text-anchor="middle" font-size="16" fill="#1e293b">Excel の WBS</text>
  <rect x="20" y="435" width="170" height="40" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="105" y="461" text-anchor="middle" font-size="16" fill="#1e293b">予定表の会議</text>
  <line x1="192" y1="405" x2="246" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="192" y1="455" x2="246" y2="445" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <line x1="330" y1="122" x2="330" y2="206" stroke="#334155" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="320" y="162" text-anchor="end" font-size="15" fill="#1e293b">表示・直接保存</text>
  <line x1="470" y1="122" x2="470" y2="206" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="480" y="156" font-size="15" fill="#1e293b">依頼を書く</text>
  <text x="480" y="176" font-size="15" fill="#1e293b">（日程・メールなど）</text>

  <line x1="330" y1="376" x2="330" y2="294" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="320" y="332" text-anchor="end" font-size="15" fill="#1e293b">承認後に書く</text>
  <text x="320" y="352" text-anchor="end" font-size="15" fill="#1e293b">（予定表の会議は承認なし）</text>
  <line x1="470" y1="294" x2="470" y2="376" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="480" y="340" font-size="15" fill="#1e293b">依頼を読む</text>

  <line x1="600" y1="400" x2="650" y2="400" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="660" y="405" font-size="15" fill="#1e293b">データの流れ</text>
  <line x1="600" y1="435" x2="650" y2="435" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="660" y="440" font-size="15" fill="#1e293b">依頼の流れ</text>
</svg>
