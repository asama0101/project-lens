<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">project-lens の全体図</title>
  <desc id="d">ブラウザの project-lens.html は、共有ファイルの .project-lens/data.json と、個人ファイルの .project-lens/personal.json の 2 つを表示して、直接保存する。共有ファイルにはプロジェクト・タスク・日程変更の履歴が入り、全員で 1 つを使う。個人ファイルには作業枠・会議・休み・依頼が入り、各自が持つ。Claude Code は、Excel の WBS を承認後に共有ファイルへ書き、予定表の会議を承認なしで個人ファイルへ書く。依頼の帯の依頼は個人ファイルから読み、変更案を書き戻す。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="510" fill="#ffffff"/>

  <rect x="200" y="20" width="400" height="96" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="400" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">project-lens.html（ブラウザ）</text>
  <text x="400" y="76" text-anchor="middle" font-size="15" fill="#0c4a6e">ガントチャート・リスト・スケジュール</text>
  <text x="400" y="98" text-anchor="middle" font-size="15" fill="#0c4a6e">稼働・設定・依頼の帯</text>

  <rect x="30" y="200" width="320" height="100" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="190" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#713f12">共有: .project-lens/data.json</text>
  <text x="190" y="256" text-anchor="middle" font-size="14" fill="#713f12">プロジェクト・タスク・日程変更の履歴</text>
  <text x="190" y="280" text-anchor="middle" font-size="14" fill="#713f12">全員で 1 つを使う</text>

  <rect x="450" y="200" width="320" height="100" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2" stroke-dasharray="9 4"/>
  <text x="610" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#831843">個人: .project-lens/personal.json</text>
  <text x="610" y="256" text-anchor="middle" font-size="14" fill="#831843">作業枠・会議・休み・依頼</text>
  <text x="610" y="280" text-anchor="middle" font-size="14" fill="#831843">各自が 1 つ持つ</text>

  <rect x="250" y="400" width="300" height="96" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
  <text x="400" y="432" text-anchor="middle" font-size="18" font-weight="bold" fill="#7c2d12">Claude Code</text>
  <text x="400" y="456" text-anchor="middle" font-size="14" fill="#7c2d12">/project-lens:intake（取り込み）</text>
  <text x="400" y="478" text-anchor="middle" font-size="14" fill="#7c2d12">/project-lens:watch（依頼の処理）</text>

  <rect x="14" y="404" width="176" height="38" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="102" y="429" text-anchor="middle" font-size="15" fill="#1e293b">Excel の WBS</text>
  <rect x="14" y="454" width="176" height="38" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="102" y="479" text-anchor="middle" font-size="15" fill="#1e293b">予定表の会議</text>
  <line x1="192" y1="423" x2="246" y2="436" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="192" y1="473" x2="246" y2="462" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <line x1="270" y1="120" x2="220" y2="196" stroke="#334155" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="232" y="152" text-anchor="end" font-size="14" fill="#1e293b">表示・直接保存</text>
  <line x1="530" y1="120" x2="580" y2="196" stroke="#334155" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="570" y="146" font-size="14" fill="#1e293b">表示・直接保存</text>
  <text x="570" y="166" font-size="14" fill="#1e293b">（依頼もここへ書く）</text>

  <line x1="330" y1="396" x2="250" y2="304" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="278" y="344" text-anchor="end" font-size="14" fill="#1e293b">承認後に書く</text>
  <text x="278" y="364" text-anchor="end" font-size="14" fill="#1e293b">（Excel の WBS）</text>
  <line x1="470" y1="396" x2="550" y2="304" stroke="#334155" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="530" y="344" font-size="14" fill="#1e293b">依頼を読み、変更案を書く</text>
  <text x="530" y="364" font-size="14" fill="#1e293b">会議を書く（承認なし）</text>
</svg>
