<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" font-family="'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">取り込みの流れ</title>
  <desc id="d">Excel の WBS と会議のプロジェクト規則の取り込みは、読み取り、変更案の表、承認、書き込みの順に進む。承認の前は data.json を変えない。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="230" fill="#ffffff"/>

  <rect x="8" y="44" width="582" height="170" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="22" y="32" font-size="16" font-weight="bold" fill="#334155">承認の前は、data.json を変えない（破線の中）</text>

  <rect x="24" y="84" width="160" height="100" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="104" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">1. 読み取り</text>
  <text x="104" y="142" text-anchor="middle" font-size="15" fill="#1e293b">Excel・CSV を</text>
  <text x="104" y="162" text-anchor="middle" font-size="15" fill="#1e293b">読む</text>

  <rect x="224" y="84" width="160" height="100" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text x="304" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">2. 変更案の表</text>
  <text x="304" y="142" text-anchor="middle" font-size="15" fill="#1e293b">追加・更新を</text>
  <text x="304" y="162" text-anchor="middle" font-size="15" fill="#1e293b">表で見せる</text>

  <rect x="424" y="84" width="150" height="100" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="499" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#713f12">3. 承認</text>
  <text x="499" y="142" text-anchor="middle" font-size="15" fill="#713f12">表を確認して、</text>
  <text x="499" y="162" text-anchor="middle" font-size="15" fill="#713f12">承認する</text>

  <rect x="630" y="84" width="150" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="705" y="116" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">4. 書き込み</text>
  <text x="705" y="142" text-anchor="middle" font-size="15" fill="#14532d">data.json を</text>
  <text x="705" y="162" text-anchor="middle" font-size="15" fill="#14532d">更新する</text>

  <line x1="186" y1="134" x2="220" y2="134" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="386" y1="134" x2="420" y2="134" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="576" y1="134" x2="626" y2="134" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
</svg>
