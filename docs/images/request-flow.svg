<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Yu Gothic','Meiryo','Hiragino Sans',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">依頼の帯から日程を変える流れ</title>
  <desc id="d">project-lens.html の依頼の帯に依頼を書くと、見張り中の Claude Code が変更案を作る。project-lens.html で変更案の表を確認し、承認して反映すると期限が更新される。却下すると何も変わらない。修正を依頼すると、Claude Code が変更案を作り直す。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <rect x="8" y="10" width="784" height="280" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#0c4a6e">project-lens.html（ブラウザ）</text>
  <rect x="8" y="310" width="784" height="130" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="20" y="430" font-size="16" font-weight="bold" fill="#7c2d12">Claude Code（/project-lens:watch で見張り中）</text>

  <rect x="24" y="50" width="170" height="90" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="109" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">1. 依頼を書く</text>
  <text x="109" y="100" text-anchor="middle" font-size="15" fill="#1e293b">依頼の帯に文章で</text>
  <text x="109" y="122" text-anchor="middle" font-size="15" fill="#1e293b">「A3 が 5 日遅れた」</text>

  <rect x="400" y="50" width="170" height="90" rx="10" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <text x="485" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#0c4a6e">2. 変更案を確認</text>
  <text x="485" y="100" text-anchor="middle" font-size="15" fill="#1e293b">帯の履歴の表で、</text>
  <text x="485" y="122" text-anchor="middle" font-size="15" fill="#1e293b">旧期限と新期限を見る</text>

  <rect x="640" y="50" width="140" height="90" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="710" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">3. 反映</text>
  <text x="710" y="100" text-anchor="middle" font-size="15" fill="#14532d">期限を更新し、</text>
  <text x="710" y="122" text-anchor="middle" font-size="15" fill="#14532d">履歴に残す</text>

  <rect x="620" y="200" width="160" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="700" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">却下</text>
  <text x="700" y="252" text-anchor="middle" font-size="15" fill="#1e293b">何も変わらない</text>

  <rect x="200" y="335" width="240" height="80" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="320" y="363" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">変更案を作る</text>
  <text x="320" y="386" text-anchor="middle" font-size="15" fill="#1e293b">影響を受けるタスクの</text>
  <text x="320" y="406" text-anchor="middle" font-size="15" fill="#1e293b">新しい期限を計算する</text>

  <line x1="120" y1="144" x2="240" y2="331" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="170" y="250" text-anchor="end" font-size="15" fill="#1e293b">依頼を送る</text>
  <line x1="410" y1="331" x2="520" y2="144" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="490" y="250" font-size="15" fill="#1e293b">変更案</text>
  <path d="M430,144 C400,200 350,260 300,331" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="300" y="210" text-anchor="end" font-size="15" fill="#1e293b">修正を依頼する</text>
  <line x1="572" y1="95" x2="636" y2="95" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="604" y="86" text-anchor="middle" font-size="15" fill="#1e293b">承認</text>
  <line x1="550" y1="144" x2="640" y2="196" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="190" font-size="15" fill="#1e293b">却下</text>
</svg>
